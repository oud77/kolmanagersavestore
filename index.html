<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pengelola KOL - Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        *{margin:0; padding:0; font-family:'Segoe UI', Roboto, Arial, sans-serif; box-sizing:border-box;}
        :root{--utama:#165DFF; --sukses:#00B42A; --peringatan:#FF7D00; --bahaya:#F53F3F; --abu:#86909C; --bg:#F7F8FA; --putih:#FFFFFF; --bayangan:0 2px 8px rgba(0,0,0,0.08);}
        body{background:var(--bg); padding:15px; max-width:1280px; margin:0 auto;}
        h1{color:#1D2129; text-align:center; margin-bottom:20px; font-size:24px;}
        .tombol{padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-weight:600; font-size:13px; margin:4px; transition:0.2s;}
        .tambah{background:var(--utama); color:white;}
        .simpan{background:var(--sukses); color:white;}
        .muat{background:var(--peringatan); color:white;}
        .hapus{background:var(--bahaya); color:white;}
        .tombol:hover{opacity:0.9;}

        /* KARTU RINGKASAN */
        .ringkasan{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-bottom:20px;}
        .kartu{background:var(--putih); padding:15px; border-radius:8px; box-shadow:var(--bayangan); border-left:4px solid var(--utama);}
        .kartu h3{font-size:12px; color:var(--abu); margin-bottom:5px;}
        .kartu .angka{font-size:22px; font-weight:700; color:#1D2129;}
        .kartu.ke2{border-left-color:var(--sukses);}
        .kartu.ke3{border-left-color:var(--peringatan);}
        .kartu.ke4{border-left-color:var(--bahaya);}

        /* GRAFIK */
        .bagrafik{display:grid; grid-template-columns:2fr 1fr; gap:15px; margin-bottom:20px;}
        @media(max-width:768px){.bagrafik{grid-template-columns:1fr;}}
        .kotak-grafik{background:var(--putih); padding:15px; border-radius:8px; box-shadow:var(--bayangan);}
        .kotak-grafik h4{margin-bottom:10px; color:#4E5969; font-size:14px;}

        /* TABEL */
        table{width:100%; border-collapse:collapse; margin-top:10px; background:var(--putih); border-radius:8px; overflow:hidden; box-shadow:var(--bayangan);}
        th, td{padding:10px 6px; text-align:center; border-bottom:1px solid #E5E6EB; font-size:12px;}
        th{background:var(--utama); color:white; font-weight:600;}
        tr:hover{background:#F2F3F5;}
        input, select{width:100%; padding:5px; border:1px solid #C9CDD4; border-radius:4px; text-align:center; font-size:12px;}
        .angka{font-weight:600;}
        .bagus{color:var(--sukses);}
        .sedang{color:var(--peringatan);}
        .buruk{color:var(--bahaya);}
        .status{margin-top:12px; font-size:12px; color:#4E5969; text-align:center; padding:8px; border-radius:6px; background:#E8F3FF;}
    </style>
</head>
<body>
    <h1>📊 Dashboard Pengelola KOL</h1>

    <!-- KARTU RINGKASAN -->
    <div class="ringkasan">
        <div class="kartu">
            <h3>Total KOL</h3>
            <div class="angka" id="totKOL">0</div>
        </div>
        <div class="kartu ke2">
            <h3>Total Omset (Rp)</h3>
            <div class="angka" id="totOmset">0</div>
        </div>
        <div class="kartu ke3">
            <h3>Total Bayar (Rp)</h3>
            <div class="angka" id="totBayar">0</div>
        </div>
        <div class="kartu ke4">
            <h3>Rata-rata ROAS</h3>
            <div class="angka" id="rataROAS">0x</div>
        </div>
    </div>

    <!-- TOMBOL -->
    <div style="text-align:center; margin-bottom:15px;">
        <button class="tombol tambah" onclick="tambahBaris()">➕ Tambah KOL</button>
        <button class="tombol simpan" onclick="simpanKeSheet()">💾 Simpan ke Sheets</button>
        <button class="tombol muat" onclick="ambilDariSheet()">🔄 Perbarui Data & Grafik</button>
    </div>

    <!-- GRAFIK -->
    <div class="bagrafik">
        <div class="kotak-grafik">
            <h4>Perbandingan Omset & ROAS KOL</h4>
            <canvas id="grafikPerforma" height="220"></canvas>
        </div>
        <div class="kotak-grafik">
            <h4>Status Kerjasama</h4>
            <canvas id="grafikStatus" height="220"></canvas>
        </div>
    </div>

    <!-- TABEL DATA -->
    <table id="tabelKOL">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Akun</th>
                <th>Komisi %</th>
                <th>Fee (Rp)</th>
                <th>Omset (Rp)</th>
                <th>Pesanan</th>
                <th>Bayar (Rp)</th>
                <th>ROAS</th>
                <th>Status</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="status" id="statusInfo">Siap digunakan</div>

<script>
const TAUTAN_SHEET = "https://script.google.com/macros/s/AKfycbwbQku3MBzb5OIsJDCxkMIb6_Hqc9M_zR-Z7vkEQ_FlN_SMlisxz7mCIkCujFzVhW1q/exec";
let nomor = 0, grafik1, grafik2;

window.onload = ambilDariSheet;

function tambahBaris(){
    nomor++;
    const tbody = document.querySelector('#tabelKOL tbody');
    const baris = document.createElement('tr');
    baris.innerHTML = `
        <td>${nomor}</td>
        <td><input type="text" placeholder="@akun"></td>
        <td><input type="number" min="0" oninput="hitung(this)"></td>
        <td><input type="number" min="0" oninput="hitung(this)"></td>
        <td><input type="number" min="0" oninput="hitung(this)"></td>
        <td><input type="number" min="0"></td>
        <td class="angka" data-bayar>-</td>
        <td class="angka" data-roas>-</td>
        <td>
            <select>
                <option>Menunggu</option>
                <option>Berjalan</option>
                <option>Selesai</option>
                <option>Berhenti</option>
            </select>
        </td>
        <td><button class="tombol hapus" onclick="hapusBaris(this)">×</button></td>
    `;
    tbody.appendChild(baris);
}

function hitung(el){
    const b = el.parentElement.parentElement;
    const komisi = parseFloat(b.children[2].querySelector('input').value) || 0;
    const fee = parseFloat(b.children[3].querySelector('input').value) || 0;
    const omset = parseFloat(b.children[4].querySelector('input').value) || 0;

    const totalBayar = omset * komisi / 100 + fee;
    b.querySelector('[data-bayar]').textContent = totalBayar > 0 ? totalBayar.toLocaleString('id-ID') : '-';

    const biaya = omset * komisi / 100 + fee;
    const roas = biaya > 0 ? (omset / biaya).toFixed(1) : '-';
    const selRoas = b.querySelector('[data-roas]');
    selRoas.textContent = roas !== '-' ? roas + 'x' : '-';
    selRoas.className = 'angka ' + (roas >= 5 ? 'bagus' : roas >= 2 ? 'sedang' : roas > 0 ? 'buruk' : '');
}

function hapusBaris(el){
    if(confirm('Yakin hapus data ini?')) el.parentElement.parentElement.remove();
}

async function simpanKeSheet(){
    document.getElementById('statusInfo').textContent = "Menyimpan data...";
    const semuaBaris = document.querySelectorAll('#tabelKOL tbody tr');
    let sukses = 0;
    for(const baris of semuaBaris){
        const data = {
            no: baris.children[0].textContent,
            nama: baris.children[1].querySelector('input').value,
            komisi: baris.children[2].querySelector('input').value,
            fee: baris.children[3].querySelector('input').value,
            omset: baris.children[4].querySelector('input').value,
            pesanan: baris.children[5].querySelector('input').value,
            bayar: baris.children[6].textContent,
            roas: baris.children[7].textContent,
            status: baris.children[8].querySelector('select').value
        };
        try{
            await fetch(TAUTAN_SHEET, {
                method: 'POST',
                mode: 'no-cors',
                headers: {"Content-Type": "text/plain;charset=utf-8"},
                body: JSON.stringify(data)
            });
            sukses++;
        }catch(e){console.log(e);}
    }
    document.getElementById('statusInfo').textContent = sukses>0 ? `✅ Tersimpan ${sukses} data! Klik Perbarui` : "⚠️ Gagal simpan";
}

async function ambilDariSheet(){
    document.getElementById('statusInfo').textContent = "Mengambil data...";
    try{
        const res = await fetch(TAUTAN_SHEET);
        const data = await res.json();
        const tbody = document.querySelector('#tabelKOL tbody');
        tbody.innerHTML = ""; nomor = 0;
        let totalOmset=0, totalBayar=0, totalRoas=0, jmlRoas=0;
        let namaKOL=[], nilaiOmset=[], nilaiRoas=[], hitungStatus={};

        if(data.length>0){
            data.forEach(baris=>{
                if(!baris[2]) return;
                tambahBaris(); const b = tbody.lastElementChild;
                b.children[1].querySelector('input').value = baris[2]||"";
                b.children[2].querySelector('input').value = baris[3]||0;
                b.children[3].querySelector('input').value = baris[4]||0;
                b.children[4].querySelector('input').value = baris[5]||0;
                b.children[5].querySelector('input').value = baris[6]||0;
                hitung(b.children[2].querySelector('input'));
                b.children[8].querySelector('select').value = baris[9]||"Menunggu";

                // HITUNG RINGKASAN & GRAFIK
                const o = parseFloat(baris[5])||0;
                const bn = parseFloat(baris[7])||0;
                const rs = parseFloat(b.children[7].textContent)||0;
                totalOmset += o; totalBayar += bn;
                if(rs>0){totalRoas += rs; jmlRoas++;}
                namaKOL.push(baris[2]); nilaiOmset.push(o); nilaiRoas.push(rs);
                hitungStatus[baris[9]] = (hitungStatus[baris[9]]||0)+1;
            });
        }

        // TAMPILKAN ANGKA RINGKASAN
        document.getElementById('totKOL').textContent = nomor;
        document.getElementById('totOmset').textContent = totalOmset.toLocaleString('id-ID');
        document.getElementById('totBayar').textContent = totalBayar.toLocaleString('id-ID');
        document.getElementById('rataROAS').textContent = jmlRoas>0 ? (totalRoas/jmlRoas).toFixed(1)+'x' : '0x';

        // BUAT GRAFIK
        if(grafik1) grafik1.destroy();
        grafik1 = new Chart(document.getElementById('grafikPerforma'),{
            type:'bar',
            data:{labels:namaKOL,datasets:[
                {label:'Omset Juta',data:nilaiOmset.map(x=>x/1000000),backgroundColor:'#165DFF80',borderColor:'#165DFF',borderWidth:1},
                {label:'ROAS',data:nilaiRoas,type:'line',borderColor:'#00B42A',backgroundColor:'transparent',borderWidth:2,yAxisID:'y1'}
            ]},
            options:{responsive:true,scales:{y:{title:{display:true,text:'Omset (Juta Rp)'}},y1:{position:'right',title:{display:true,text:'ROAS'}}}}
        });

        if(grafik2) grafik2.destroy();
        grafik2 = new Chart(document.getElementById('grafikStatus'),{
            type:'doughnut',
            data:{labels:Object.keys(hitungStatus),datasets:[{data:Object.values(hitungStatus),backgroundColor:['#165DFF','#00B42A','#FF7D00','#F53F3F']}]},
            options:{responsive:true}
        });

        document.getElementById('statusInfo').textContent = "✅ Data & Grafik Terbaru Dimuat!";
    }catch{
        document.getElementById('statusInfo').textContent = "⚠️ Siap, coba simpan data dulu!";
    }
}
</script>
</body>
</html>

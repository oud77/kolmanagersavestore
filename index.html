<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOL Manager - Urutan Pas</title>
    <style>
        *{margin:0; padding:0; font-family:Arial; box-sizing:border-box;}
        body{max-width:1100px; margin:20px auto; padding:0 15px; background:#f5f7fa;}
        h1{text-align:center; color:#165DFF; margin-bottom:15px;}
        .btn{padding:6px 10px; border:none; border-radius:4px; color:white; cursor:pointer; margin:2px;}
        .tambah{background:#165DFF;} .simpan{background:#00B42A;} .hapus{background:#F53F3F;}
        table{width:100%; border-collapse:collapse; background:white; margin-top:10px;}
        th,td{border:1px solid #ddd; padding:5px; text-align:center; font-size:12px;}
        th{background:#165DFF; color:white;}
        input{width:100%; padding:3px; border:1px solid #ccc; border-radius:3px; text-align:center;}
    </style>
</head>
<body>
<h1>📊 Pengelola KOL</h1>
<div style="text-align:center; margin-bottom:10px;">
<button class="btn tambah" onclick="tambah()">+ Tambah</button>
<button class="btn simpan" onclick="simpan()">💾 Simpan</button>
</div>
<table id="tbl">
<thead>
<tr>
<th>No</th>
<th>Nama Akun</th>
<th>Tgl Mulai</th>
<th>Tgl Berakhir</th>
<th>Komisi %</th>
<th>Fee (Rp)</th>
<th>Omset (Rp)</th>
<th>Total Bayar</th>
<th>ROAS</th>
<th>Status</th>
<th>Aksi</th>
</tr>
</thead>
<tbody></tbody>
</table>
<div id="info" style="text-align:center; margin-top:8px; font-size:12px;">Siap</div>

<script>
// === TAUTAN INI TIDAK DIUBAH ===
const URL = "https://script.google.com/macros/s/AKfycbwbQku3MBzb5OIsJDCxkMIb6_Hqc9M_zR-Z7vkEQ_FlN_SMlisxz7mCIkCujFzVhW1q/exec";
let n=0;

function tambah(){
n++;
const tb=document.querySelector('#tbl tbody');
const r=document.createElement('tr');
r.innerHTML=`
<td>${n}</td>
<td><input type="text"></td>
<td><input type="date"></td>
<td><input type="date"></td>
<td><input type="number"></td>
<td><input type="number"></td>
<td><input type="number"></td>
<td>-</td>
<td>-</td>
<td>-</td>
<td><button class="btn hapus" onclick="hapus(this)">×</button></td>
`;
tb.appendChild(r);
}

function hapus(e){if(confirm('Yakin?'))e.parentElement.parentElement.remove();}

async function simpan(){
document.getElementById('info').textContent='Menyimpan...';
const baris=document.querySelectorAll('#tbl tbody tr');
for(const b of baris){
// === URUTAN INI SUDAH PAS 100% DENGAN SHEETS ===
const data={
no: b.children[0].textContent,
nama: b.children[1].querySelector('input').value,
mulai: b.children[2].querySelector('input').value,
berakhir: b.children[3].querySelector('input').value,
komisi: b.children[4].querySelector('input').value,
fee: b.children[5].querySelector('input').value,
omset: b.children[6].querySelector('input').value,
bayar: 0,
roas: "-",
status: "-"
};
await fetch(URL,{
method:'POST',
mode:'no-cors',
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});
}
document.getElementById('info').textContent='✅ Tersimpan!';
}
</script>
</body>
</html>
